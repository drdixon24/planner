<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Planner</title>
<style>
:root{--bg:#F6F3EE;--card:#FFFFFF;--ink:#1D1B18;--soft:#6B655C;--line:#D9D3C8;--accent:#1F5F55;--accent-ink:#FFFFFF;--bad:#A3361F}
@media (prefers-color-scheme: dark){:root{--bg:#161513;--card:#201E1B;--ink:#EEEAE3;--soft:#A39D93;--line:#3A3630;--accent:#5FB3A3;--accent-ink:#0E1513;--bad:#F08A70}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:360px}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 16px;color:var(--soft);font-size:14px}
label.f{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=password]{width:100%;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;margin:14px 0 18px;font-size:14px}
.row input{width:18px;height:18px;accent-color:var(--accent)}
button{width:100%;font-size:16px;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:14px;min-height:1.4em;margin:10px 0 0}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Planner</h1>
  <p>Enter your password to open it.</p>
  <label class="f" for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  <label class="row"><input id="rem" type="checkbox" checked> Remember on this device</label>
  <button id="go" type="submit">Open</button>
  <p class="err" id="err" role="alert"></p>
</form>

async function deriveBits(pw){

if(saved){
  const f=document.getElementById("f"); f.style.visibility="hidden";
  const auto=async()=>{ try{ await openWith(b64(saved)); }catch(e){ try{ localStorage.removeItem(KEY); }catch(_){} f.style.visibility="visible"; } };
  if(document.readyState==="complete") auto(); else window.addEventListener("load",auto,{once:true});
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const go=document.getElementById("go"), err=document.getElementById("err");
  err.textContent=""; go.disabled=true; go.textContent="Opening…";
  try{
    const bits=await deriveBits(document.getElementById("pw").value);
    if(document.getElementById("rem").checked){ try{ localStorage.setItem(KEY,toB64(bits)); }catch(_){} }
    await openWith(bits);
  }catch(x){
    try{ localStorage.removeItem(KEY); }catch(_){}
    err.textContent="That password didn't work. Check it and try again.";
    go.disabled=false; go.textContent="Open";
  }
});
</script>
</body>
</html>
